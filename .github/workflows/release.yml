# Builds the mod from a version tag and publishes it as a GitHub release, so the downloadable jar
# always comes from a clean build of exactly the tagged commit.
#
# To release: set `version` in gradle.properties, add a section to CHANGELOG.md, commit, then
#   git tag v<mod version without the +mc suffix>   (for example v0.1.0)
#   git push origin v<...>
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check that the tag matches the mod version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "${version%%+*}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in gradle.properties"
            exit 1
          fi
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Extract release notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build and test
        run: ./gradlew build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/wildfront-${MOD_VERSION}.jar" \
            "build/libs/wildfront-${MOD_VERSION}-sources.jar" \
            --title "Wildfront ${MOD_VERSION}" \
            --notes-file release-notes.md
