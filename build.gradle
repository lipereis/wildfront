plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Loom adds the repositories needed for Minecraft and Fabric automatically.
	// Only add repositories here when depending on other mods.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"wildfront" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "wildfront-test"
		enableGameTests = true
		enableClientGameTests = true
		// The dedicated-server part of the client game tests needs the Minecraft EULA
		// (https://aka.ms/MinecraftEULA). It is only accepted when asked for on the command line:
		//   gradlew runClientGameTest -Pwildfront.acceptMinecraftEula=true
		eula = providers.gradleProperty("wildfront.acceptMinecraftEula").map { it == "true" }.getOrElse(false)
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"

	// Mods placed next to the release jar by runProductionClient.
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

// Game tests start from a new world every time, so a run cannot be affected by what an earlier
// run left behind. Without this, locally repeated runs behave differently from CI.
tasks.named("runGameTest") {
	def world = layout.buildDirectory.dir("run/gameTest/world")
	doFirst {
		world.get().asFile.deleteDir()
	}
}

// An eula.txt left behind by an earlier run that accepted the EULA must not carry over to a run
// that did not ask for it.
tasks.named("runClientGameTest") {
	def eulaFile = layout.buildDirectory.file("run/clientGameTest/eula.txt")
	def accepted = providers.gradleProperty("wildfront.acceptMinecraftEula").map { it == "true" }.getOrElse(false)
	doFirst {
		if (!accepted) {
			eulaFile.get().asFile.delete()
		}
	}
}

// Starts a real, non-development client with the release jar, the way a player would run it.
tasks.register("runProductionClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "fabric"
	description = "Runs the built mod jar in a production client."
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
